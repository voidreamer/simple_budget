name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/apps/simple_budget
            ./deploy.sh

      - name: Verify API health
        if: ${{ secrets.APP_URL != '' }}
        run: |
          sleep 10
          curl --fail --silent --show-error "${{ secrets.APP_URL }}/api/health"
